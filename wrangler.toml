# ═══════════════════════════════════════════════════════════════════
# wrangler.toml — Cloudflare Workers config for Zenith
# ═══════════════════════════════════════════════════════════════════
#
# nodejs_compat: Required for Firebase SDK and Clerk to work on Workers.
# .open-next/: Generated by opennextjs-cloudflare build — never commit it.
#              Make sure .open-next/ is in .gitignore.
#
# Deploy: npm run deploy
# Preview locally: npm run preview
# ═══════════════════════════════════════════════════════════════════

name = "zenith"
main = ".open-next/worker.js"
compatibility_date = "2026-07-26"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
